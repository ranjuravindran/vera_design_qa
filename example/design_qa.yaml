# design_qa.yaml - generated by `dart run design_qa:init`.
# Edit freely; re-running init only ever appends newly found routes.
# Full reference: package:design_qa/doc/design_qa_yaml_reference.md

tokens:
  source: lib/tokens.dart
  colors:
    primary: '#FF2962FF'
    surface: '#FFFFFFFF'
    textPrimary: '#FF1B1B1F'
    textSecondary: '#FF5C5C66'
    error: '#FFD32F2F'
  spacing:
    xs: 4
    sm: 8
    md: 16
    lg: 24
    xl: 32
  radius:
    sm: 4
    md: 8
    lg: 16

routes:
  - name: '/'
    mockArgs: {}
  - name: '/broken'
    mockArgs: {}
  - name: '/profile'
    mockArgs: { userId: 'demo-user-1' }

reference:
  opacity: 0.5
  blend: difference # off | opacity | difference

lint:
  enabled: true
  tolerance: 0
